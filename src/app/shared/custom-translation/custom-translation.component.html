<a href="javascript:void(0)" (click)="showModal=true" class="nav-link text-light px-0 align-middle">
    <i class="fs-4 bi bi-translate"></i> <span class="ms-1 d-none d-sm-inline">{{'ADD_CUSTOM_TRANSLATION'|translate}}</span></a>
<div class="modal" *ngIf="showModal">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Translation</h5>
          <button type="button" class="close" (click)="showModal=false;" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <div>
                <div class="form-group">
                  <label for="key">Label Name</label>
                  <input type="text" class="form-control" id="key" [(ngModel)]="newKey" placeholder="Enter Label">
                </div>
                <div class="form-group my-2">
                  <label for="value">Translated Text</label>
                  <input type="text" class="form-control" id="value" [(ngModel)]="newValue" placeholder="Enter Translated Text">
                </div>
                <div class="form-group my-2">
                    <select class="form-control" [(ngModel)]="selectedLangToTranslate" id="lang">
                    <option value="" selected="true">Select Lang....</option>
                      <option value="en">English</option>
                      <option value="es">Spanish</option>
                    </select>
                  </div>
                  <div class="d-flex align-items-center">
                      <button type="button" class="btn btn-primary" [disabled]="!newKey || !newValue" (click)="setNewTransaltion(newKey,newValue,selectedLangToTranslate)">Submit</button>
                    <div class="spinner-border text-primary mx-2" *ngIf="loader"></div>
                  </div>
              </div>
        </div>
      </div>
    </div>
  </div>
