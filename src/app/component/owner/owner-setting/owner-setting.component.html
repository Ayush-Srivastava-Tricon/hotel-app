<div class="container">
    <div class="row">
        <div class="col-sm-12">
            <form [formGroup]="loginForm" (ngSubmit)="getFormValues()"  >
                <div class="form-group">
                  <label for="exampleInputEmail1">Name</label>
                  <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email" formControlName="name">
                </div>
                <div class="form-group">
                  <label for="exampleInputPassword1">Address</label>
                  <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Address" formControlName="address">
                </div>
                <div class="form-group">
                  <label for="exampleInputPassword1">Contact</label>
                  <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contact"  formControlName="contact">
                </div>
                <div class="form-group">
                  <label for="exampleInputPassword1">City Tax</label>
                  <input type="password" class="form-control" id="exampleInputPassword1" placeholder="City Tax"  formControlName="cityTax" >
                </div>
                <button type="submit" class="btn btn-primary my-3">Submit</button>
              </form>
            
        </div>
    </div>
</div>
