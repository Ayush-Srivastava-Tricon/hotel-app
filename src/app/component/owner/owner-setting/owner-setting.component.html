<fieldset class="container p-3 shadow my-3 w-50">
  <legend class="float-none w-auto"> <button class="btn text-light btn-primary rounded-0">Profile Setting
    </button> </legend>
  <div class="form-group row ">
    <label class="col-sm-3 col-form-label" for="usedType">Name </label>
    <div class="col-sm-9">
      <div class="input-group">
        <input type="name" class="form-control" [(ngModel)]="profileSettingConfig.name">
      </div>
    </div>
  </div>
  <div class="form-group row my-2">
    <label class="col-sm-3 col-form-label" for="usedType">Alternate Email </label>
    <div class="col-sm-9">
      <div class="input-group">
        <input type="email" class="form-control" [(ngModel)]="profileSettingConfig.alternate_email">
      </div>
    </div>
  </div>
  <div class="form-group row my-2">
    <label class="col-sm-3 col-form-label" for="usedType">Mobile </label>
    <div class="col-sm-9">
      <div class="input-group">
        <input type="number" class="form-control" [(ngModel)]="profileSettingConfig.mobile">
      </div>
    </div>
  </div>
  <div class="form-group row ">
    <label class="col-sm-3 col-form-label" for="usedType">Alternate Mobile </label>
    <div class="col-sm-9">
      <div class="input-group">
        <input type="number" class="form-control" [(ngModel)]="profileSettingConfig.alternate_mobile">
      </div>
    </div>
  </div>
  <div class="row my-2">
    <div class="col-sm-12 d-flex">
      <button type="button" class="btn btn-primary btn-sm" [disabled]="loader||error.hasError||error.confirmError"
        (click)="update()">Update</button>
      <div class="spinner-border text-success mx-2" *ngIf="loader"></div>
    </div>
  </div>
</fieldset>
